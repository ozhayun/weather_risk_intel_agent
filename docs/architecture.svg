<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="Helvetica, Arial, sans-serif">
  <title>Weather Risk Intelligence Agent — architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrow-llm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8430ce"/>
    </marker>
    <style>
      .panel { fill: #f8f9fa; stroke: #dadce0; stroke-width: 1.5; }
      .panel-title { font-size: 15px; font-weight: 700; fill: #202124; }
      .panel-sub { font-size: 12px; fill: #5f6368; }
      .code { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.5; }
      .llm { fill: #f3e8fd; stroke: #8430ce; stroke-width: 1.5; }
      .data { fill: #e6f4ea; stroke: #188038; stroke-width: 1.5; }
      .ext { fill: #ffffff; stroke: #5f6368; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .ui { fill: #fef7e0; stroke: #e37400; stroke-width: 1.5; }
      .t { font-size: 13px; font-weight: 700; fill: #202124; }
      .s { font-size: 11px; fill: #3c4043; }
      .edge { stroke: #5f6368; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .edge-llm { stroke: #8430ce; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow-llm); }
      .label { font-size: 11px; fill: #5f6368; }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#202124">Weather Risk Intelligence Agent — architecture</text>
  <text x="40" y="66" class="panel-sub">The LLM turns language into a typed plan and the result back into language; every number, ranking and premise check is computed by code.</text>

  <!-- ============ Offline panel ============ -->
  <rect x="20" y="90" width="300" height="620" rx="10" class="panel"/>
  <text x="36" y="114" class="panel-title">Offline · run once, output committed</text>
  <text x="36" y="132" class="panel-sub">Static dataset: 2021–2025</text>

  <rect x="40" y="150" width="260" height="52" rx="8" class="ext"/>
  <text x="170" y="172" text-anchor="middle" class="t">FEMA National Risk Index</text>
  <text x="170" y="190" text-anchor="middle" class="s">public ArcGIS FeatureServer · 3,232 counties</text>

  <rect x="40" y="232" width="260" height="52" rx="8" class="code"/>
  <text x="170" y="254" text-anchor="middle" class="t">scripts/build_nri_subset.py</text>
  <text x="170" y="272" text-anchor="middle" class="s">10 frequency columns → national percentiles</text>

  <rect x="40" y="314" width="260" height="46" rx="8" class="data"/>
  <text x="170" y="334" text-anchor="middle" class="t">data/nri_hubs.csv</text>
  <text x="170" y="350" text-anchor="middle" class="s">15 hub counties × 10 hazards</text>

  <rect x="40" y="400" width="260" height="52" rx="8" class="ext"/>
  <text x="170" y="422" text-anchor="middle" class="t">Open-Meteo Historical API</text>
  <text x="170" y="440" text-anchor="middle" class="s">daily snow · rain · temp · heat index · gusts</text>

  <rect x="40" y="482" width="260" height="52" rx="8" class="code"/>
  <text x="170" y="504" text-anchor="middle" class="t">scripts/ingest.py</text>
  <text x="170" y="522" text-anchor="middle" class="s">throttle + retry on 429/5xx</text>

  <rect x="40" y="566" width="260" height="46" rx="8" class="data"/>
  <text x="170" y="586" text-anchor="middle" class="t">data/hubs.json</text>
  <text x="170" y="602" text-anchor="middle" class="s">15 real FedEx hubs, regions, aliases</text>

  <rect x="40" y="640" width="260" height="52" rx="8" class="code"/>
  <text x="170" y="662" text-anchor="middle" class="t">scripts/score_report.py</text>
  <text x="170" y="680" text-anchor="middle" class="s">calibration table (scoring v1.1)</text>

  <path d="M170 202 V228" class="edge"/>
  <path d="M170 284 V310" class="edge"/>
  <path d="M170 452 V478" class="edge"/>
  <path d="M300 337 C 330 337, 330 508, 304 508" class="edge"/>
  <text x="334" y="425" class="label">NRI rows</text>

  <!-- ============ Runtime: UI + API ============ -->
  <rect x="380" y="96" width="240" height="78" rx="10" class="ui"/>
  <text x="500" y="122" text-anchor="middle" class="t">Streamlit UI · ui/app.py</text>
  <text x="500" y="140" text-anchor="middle" class="s">chat · "How I got this" panel</text>
  <text x="500" y="156" text-anchor="middle" class="s">ranking table · input lock · autofocus</text>

  <rect x="690" y="96" width="250" height="78" rx="10" class="code"/>
  <text x="815" y="122" text-anchor="middle" class="t">FastAPI · app/api</text>
  <text x="815" y="140" text-anchor="middle" class="s">POST /chat (LLM)</text>
  <text x="815" y="156" text-anchor="middle" class="s">GET /hubs · /hubs/{hub} · /rankings · /health</text>

  <path d="M620 128 H686" class="edge"/>
  <path d="M690 146 H624" class="edge"/>
  <text x="628" y="118" class="label">HTTP JSON</text>

  <!-- ============ Agent pipeline ============ -->
  <rect x="380" y="214" width="580" height="316" rx="10" class="panel"/>
  <text x="396" y="238" class="panel-title">Agent pipeline · app/agent</text>
  <text x="396" y="256" class="panel-sub">≤ 2 LLM calls per turn · schema-enforced outputs</text>

  <rect x="396" y="274" width="104" height="128" rx="8" class="code"/>
  <text x="448" y="296" text-anchor="middle" class="t">0 · Pre-check</text>
  <text x="448" y="318" text-anchor="middle" class="s">flood / storm /</text>
  <text x="448" y="333" text-anchor="middle" class="s">hurricane day</text>
  <text x="448" y="348" text-anchor="middle" class="s">counts → fixed</text>
  <text x="448" y="363" text-anchor="middle" class="s">NRI refusal</text>
  <text x="448" y="385" text-anchor="middle" class="s">(no LLM call)</text>

  <rect x="510" y="274" width="104" height="128" rx="8" class="llm"/>
  <text x="562" y="296" text-anchor="middle" class="t">1 · Interpret</text>
  <text x="562" y="318" text-anchor="middle" class="s">LLM → QueryPlan</text>
  <text x="562" y="333" text-anchor="middle" class="s">5-tool union</text>
  <text x="562" y="348" text-anchor="middle" class="s">&lt;user_input&gt;</text>
  <text x="562" y="363" text-anchor="middle" class="s">fencing</text>
  <text x="562" y="385" text-anchor="middle" class="s">history-aware</text>

  <rect x="624" y="274" width="104" height="128" rx="8" class="code"/>
  <text x="676" y="296" text-anchor="middle" class="t">2 · Execute</text>
  <text x="676" y="318" text-anchor="middle" class="s">rank_hubs</text>
  <text x="676" y="333" text-anchor="middle" class="s">compare_hubs</text>
  <text x="676" y="348" text-anchor="middle" class="s">get_weather_stat</text>
  <text x="676" y="363" text-anchor="middle" class="s">explain_hub</text>
  <text x="676" y="385" text-anchor="middle" class="s">scope checks</text>

  <rect x="738" y="274" width="104" height="128" rx="8" class="llm"/>
  <text x="790" y="296" text-anchor="middle" class="t">3 · Narrate</text>
  <text x="790" y="318" text-anchor="middle" class="s">LLM → Answer</text>
  <text x="790" y="333" text-anchor="middle" class="s">numbers must</text>
  <text x="790" y="348" text-anchor="middle" class="s">match the result</text>
  <text x="790" y="363" text-anchor="middle" class="s">(grounding</text>
  <text x="790" y="378" text-anchor="middle" class="s">validator)</text>

  <rect x="852" y="274" width="96" height="128" rx="8" class="code"/>
  <text x="900" y="296" text-anchor="middle" class="t">4 · Guards</text>
  <text x="900" y="318" text-anchor="middle" class="s">premise check</text>
  <text x="900" y="333" text-anchor="middle" class="s">lead line</text>
  <text x="900" y="348" text-anchor="middle" class="s">prompt-leak</text>
  <text x="900" y="363" text-anchor="middle" class="s">guard</text>
  <text x="900" y="378" text-anchor="middle" class="s">follow-up filter</text>

  <path d="M500 338 H506" class="edge"/>
  <path d="M614 338 H620" class="edge"/>
  <path d="M728 338 H734" class="edge"/>
  <path d="M842 338 H848" class="edge"/>

  <rect x="396" y="418" width="552" height="44" rx="8" class="code"/>
  <text x="672" y="437" text-anchor="middle" class="t">Session memory (last 4 turns)</text>
  <text x="672" y="453" text-anchor="middle" class="s">message · PLAN · RESULT summary · REPLY → resolves "why?", "yes", "what about X?"</text>

  <rect x="396" y="474" width="552" height="42" rx="8" class="code"/>
  <text x="672" y="493" text-anchor="middle" class="t">Clarify / out-of-scope paths skip narration</text>
  <text x="672" y="508" text-anchor="middle" class="s">unknown city → hub list · year outside 2021–2025 → window · forecast / ROI → one offer</text>

  <path d="M815 174 V210" class="edge"/>
  <text x="822" y="198" class="label">run(session, message)</text>

  <!-- ============ LLM provider ============ -->
  <rect x="1010" y="268" width="250" height="118" rx="10" class="llm"/>
  <text x="1135" y="294" text-anchor="middle" class="t">LLM via Instructor</text>
  <text x="1135" y="314" text-anchor="middle" class="s">LLM_MODEL in .env</text>
  <text x="1135" y="330" text-anchor="middle" class="s">openai/gpt-4o-mini (default)</text>
  <text x="1135" y="346" text-anchor="middle" class="s">anthropic/… · ollama/…</text>
  <text x="1135" y="368" text-anchor="middle" class="s">no code change to switch</text>

  <path d="M562 274 C 562 264, 580 264, 600 264 H 970 C 995 264, 1000 280, 1006 296" class="edge-llm"/>
  <path d="M790 402 C 790 420, 1000 420, 1080 388" class="edge-llm"/>
  <text x="900" y="259" class="label" fill="#8430ce">QueryPlan</text>
  <text x="975" y="420" class="label" fill="#8430ce">Answer</text>

  <!-- ============ Domain ============ -->
  <rect x="380" y="572" width="580" height="160" rx="10" class="panel"/>
  <text x="396" y="596" class="panel-title">Domain · app/domain — pure, deterministic, no I/O</text>

  <rect x="396" y="612" width="132" height="104" rx="8" class="code"/>
  <text x="462" y="634" text-anchor="middle" class="t">hubs.py</text>
  <text x="462" y="654" text-anchor="middle" class="s">registry · regions</text>
  <text x="462" y="669" text-anchor="middle" class="s">exact alias</text>
  <text x="462" y="684" text-anchor="middle" class="s">resolution</text>
  <text x="462" y="699" text-anchor="middle" class="s">("St Louis", "KC")</text>

  <rect x="538" y="612" width="132" height="104" rx="8" class="code"/>
  <text x="604" y="634" text-anchor="middle" class="t">metrics.py</text>
  <text x="604" y="654" text-anchor="middle" class="s">day conditions</text>
  <text x="604" y="669" text-anchor="middle" class="s">counts · coverage</text>
  <text x="604" y="684" text-anchor="middle" class="s">stat catalog</text>
  <text x="604" y="699" text-anchor="middle" class="s">(9 day metrics)</text>

  <rect x="680" y="612" width="132" height="104" rx="8" class="code"/>
  <text x="746" y="634" text-anchor="middle" class="t">scoring.py</text>
  <text x="746" y="654" text-anchor="middle" class="s">H = α·OBS + (1−α)·NRI</text>
  <text x="746" y="669" text-anchor="middle" class="s">R = Σ w·H · labels</text>
  <text x="746" y="684" text-anchor="middle" class="s">flags → ScoreBook</text>
  <text x="746" y="699" text-anchor="middle" class="s">(built at startup)</text>

  <rect x="822" y="612" width="126" height="104" rx="8" class="code"/>
  <text x="885" y="634" text-anchor="middle" class="t">queries.py</text>
  <text x="885" y="654" text-anchor="middle" class="s">results.py</text>
  <text x="885" y="669" text-anchor="middle" class="s">tool executors</text>
  <text x="885" y="684" text-anchor="middle" class="s">premise check</text>
  <text x="885" y="699" text-anchor="middle" class="s">caveats · order</text>

  <path d="M676 402 V568" class="edge"/>
  <text x="684" y="556" class="label">validated plan → Result</text>
  <path d="M940 174 C 990 200, 990 540, 950 568" class="edge"/>
  <text x="990" y="470" class="label">/hubs, /rankings</text>
  <text x="990" y="484" class="label">(no LLM)</text>

  <!-- ============ Data / config ============ -->
  <rect x="1010" y="520" width="250" height="52" rx="8" class="data"/>
  <text x="1135" y="542" text-anchor="middle" class="t">config/scoring.toml</text>
  <text x="1135" y="560" text-anchor="middle" class="s">weights · α · caps · bands · v1.1</text>

  <rect x="1010" y="602" width="250" height="52" rx="8" class="code"/>
  <text x="1135" y="624" text-anchor="middle" class="t">app/data/db.py</text>
  <text x="1135" y="642" text-anchor="middle" class="s">SQLite schema + reads</text>

  <ellipse cx="1135" cy="690" rx="115" ry="14" class="data"/>
  <path d="M1020 690 V756 A115 14 0 0 0 1250 756 V690" class="data"/>
  <ellipse cx="1135" cy="690" rx="115" ry="14" class="data"/>
  <text x="1135" y="722" text-anchor="middle" class="t">data/weather.db (SQLite)</text>
  <text x="1135" y="740" text-anchor="middle" class="s">27,390 daily rows · 150 NRI rows · meta</text>

  <path d="M1010 546 C 985 546, 985 600, 964 610" class="edge"/>
  <path d="M1010 628 H964" class="edge"/>
  <path d="M1135 654 V672" class="edge"/>

  <!-- ingest → db, along the bottom -->
  <path d="M170 534 C 130 560, 30 560, 30 760 C 30 800, 60 810, 120 810 H1080 C 1135 810, 1135 790, 1135 772" class="edge"/>
  <text x="560" y="802" class="label">daily weather + NRI rows (written once, committed)</text>

  <!-- ============ Legend ============ -->
  <g transform="translate(40, 838)">
    <rect x="0" y="0" width="22" height="16" rx="3" class="code"/>
    <text x="30" y="13" class="s">Deterministic code</text>
    <rect x="170" y="0" width="22" height="16" rx="3" class="llm"/>
    <text x="200" y="13" class="s">LLM step (schema-enforced)</text>
    <rect x="390" y="0" width="22" height="16" rx="3" class="data"/>
    <text x="420" y="13" class="s">Data / config (committed)</text>
    <rect x="590" y="0" width="22" height="16" rx="3" class="ext"/>
    <text x="620" y="13" class="s">External public API (offline only)</text>
    <rect x="830" y="0" width="22" height="16" rx="3" class="ui"/>
    <text x="860" y="13" class="s">User interface</text>
  </g>
  <text x="40" y="884" class="label">Dependency rule: api → agent → domain ← data. Runtime makes no external data calls — only the LLM call.</text>
</svg>
